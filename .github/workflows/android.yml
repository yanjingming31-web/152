name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract project
      run: |
        # 创建 source 目录，并把 source.zip 解压进去
        mkdir -p source
        unzip -q source.zip -d source
        
        echo "=== 解压成功，当前目录结构如下 ==="
        ls -la source

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        # 强制使用 8.9 版本，解决之前版本过低报错
        gradle-version: '8.9'

    - name: Build APK
      run: |
        # 自动寻找 settings.gradle 所在的目录（也就是项目根目录）
        PROJECT_DIR=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
        
        if [ -z "$PROJECT_DIR" ]; then
          echo "❌ 错误：没有找到 Gradle 项目！请检查压缩包内文件结构。"
          echo "source 目录下的内容如下："
          find source -maxdepth 3 -type f
          exit 1
        fi
        
        echo "✅ 成功找到项目目录: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # 赋予执行权限
        chmod +x gradlew
        
        # 开始编译
        echo "🚀 开始编译 APK..."
        ./gradlew --no-daemon assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        # 自动寻找编译生成的 apk 文件
        path: source/**/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
