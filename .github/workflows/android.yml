name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract project
      run: |
        echo "====== 1. 检查根目录文件 ======"
        ls -la
        
        echo "====== 2. 开始解压 source.zip ======"
        mkdir -p source
        unzip -q source.zip -d source || echo "解压失败，请检查 source.zip 是否存在！"
        
        echo "====== 3. 查看 source 内的文件结构 ======"
        find source -maxdepth 4 -type f

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Build APK
      run: |
        echo "====== 4. 寻找 Gradle 项目 ======"
        SETTINGS_FILE=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
        
        # 关键修改：如果没找到 settings.gradle，立刻报错并退出，绝不执行 dirname
        if [ -z "$SETTINGS_FILE" ]; then
          echo "❌ 致命错误：在 source 目录下没有找到 settings.gradle 或 settings.gradle.kts 文件！"
          echo "这说明你的 source.zip 内部目录结构不对。"
          echo "请看上面第 3 步打印出的文件列表，确认是否有这个文件。"
          exit 1
        fi
        
        echo "✅ 成功找到大门文件: $SETTINGS_FILE"
        PROJECT_DIR=$(dirname "$SETTINGS_FILE")
        echo "✅ 项目根目录位于: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        chmod +x gradlew
        echo "🚀 开始编译 APK..."
        ./gradlew --no-daemon assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: source/**/build/outputs/apk/debug/*.apk
        if-no-files-found: error
