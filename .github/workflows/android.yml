name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract project
      run: |
        echo "====== 第一步：检查压缩包是否存在 ======"
        ls -la
        
        echo "====== 第二步：开始解压 source.zip ======"
        mkdir -p source
        unzip -q source.zip -d source || true
        
        echo "====== 第三步：解压后 source 文件夹内的结构 ======"
        ls -la source
        find source -maxdepth 3 -type f

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Build APK
      run: |
        echo "====== 第四步：寻找 Gradle 项目 ======"
        # 先获取 settings.gradle 的路径，避免直接传给 dirname 导致报错
        SETTINGS_FILE=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
        
        if [ -z "$SETTINGS_FILE" ]; then
          echo "❌ 错误：在 source 目录下找不到 settings.gradle 或 settings.gradle.kts 文件！"
          echo "这说明你上传的 ZIP 包内部结构不正确，或者解压出来的内容不是 Android 工程。"
          exit 1
        fi
        
        # 获取项目根目录
        PROJECT_DIR=$(dirname "$SETTINGS_FILE")
        echo "✅ 成功找到项目目录: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        chmod +x gradlew
        echo "🚀 开始编译 APK..."
        ./gradlew --no-daemon assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: source/**/build/outputs/apk/debug/*.apk
        if-no-files-found: error
